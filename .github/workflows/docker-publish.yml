name: Docker image

# Builds the Dockerfile for amd64 and arm64. Pull requests and pushes to
# main only build (no registry login, no push). Only stable semver tags
# (vX.Y.Z, no prerelease suffix like -rc.1) publish to GitHub Container
# Registry and move `latest`; prerelease tags never touch the registry
# (23-F1). Publishes in one step: build-push applies the semver tags and
# `latest` atomically in a single manifest push, so there is no window
# where `latest` lags the version tags (23-F2, one-step, documented).
# Logs in with the built-in GITHUB_TOKEN, so no repository secrets are needed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Publishing stays off (build-only, CI green) except on stable semver tags
  # (vX.Y.Z, no prerelease suffix). `latest` must track the last stable
  # release: v1.0.0-rc.1 or v-foo can never publish or move it (23-F1).
  STABLE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-') == false }}
  PUBLISH: ${{ env.STABLE_TAG == 'true' }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ env.STABLE_TAG == 'true' }}
            type=semver,pattern={{version}},enable=${{ env.STABLE_TAG == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE_TAG == 'true' }}
            type=semver,pattern={{major}},enable=${{ env.STABLE_TAG == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # PRs prove the Dockerfile builds on one arch only; full amd64+arm64
          # is built where the image is actually used (main pushes, tags).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
