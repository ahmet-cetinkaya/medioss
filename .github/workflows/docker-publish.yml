name: Docker image

# Builds the Dockerfile for amd64 and arm64. Pull requests, pushes to
# main, and runs before the repository variable DOCKERHUB_IMAGE is set,
# only build (no registry login, no push). `v*` tags publish the semver
# tags and move `latest` to the released version. Needs the repository
# secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not the account password).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # PLACEHOLDER until the owner picks the Docker Hub namespace and name.
  # Override without editing this file via the repository variable DOCKERHUB_IMAGE.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'CHANGE-ME/medioss' }}
  # Publishing stays off (build-only, CI green) except on v* tags, and only
  # once DOCKERHUB_IMAGE is set. `latest` must track the last release, not
  # every main push.
  PUBLISH: ${{ vars.DOCKERHUB_IMAGE != '' && startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
