name: Docker image

# Builds the Dockerfile for amd64 and arm64. Pull requests only build (no
# registry login, no push). Pushes to main publish `latest`; v* tags publish
# the semver tags. Needs the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (a Docker Hub access token, not the account password).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # PLACEHOLDER until the owner picks the Docker Hub namespace and name.
  # Override without editing this file via the repository variable DOCKERHUB_IMAGE.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'CHANGE-ME/medioss' }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
