name: CI

# Push runs only on main: feature branches are covered by their PR's
# pull_request run, so a pushed branch does not burn a second run (the
# 2026-10-18 asset-commit incident triggered ~56 billing-blocked runs
# that way). Docs-only changes skip the heavy jobs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-e2e-not-a-real-secret
      MEDIOSS_ORIGIN: http://localhost
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Activate pinned toolchain
        run: rustup show active-toolchain

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Dependency advisories
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

      - name: Guard the rsa advisory ignore
        run: |
          # .cargo/audit.toml ignores RUSTSEC-2023-0071 only while rsa is not compiled.
          if [ -n "$(cargo tree --locked --workspace -e normal -i rsa 2>/dev/null)" ]; then
            echo "rsa is now in the build graph: remove the audit ignore and fix it" >&2
            exit 1
          fi

      - name: Dependency boundaries
        run: ./scripts/check-boundaries.sh --self-test && ./scripts/check-boundaries.sh

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: src/apps/web-ui

      - name: Build
        run: bun run build
        working-directory: src/apps/web-ui

      - name: Assert island hydration marker
        run: grep -q astro-island dist/index.html
        working-directory: src/apps/web-ui

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [rust, web-ui]
    env:
      SESSION_SECRET: ci-smoke-test-not-a-real-secret
      MEDIOSS_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for health endpoint
        run: |
          for _ in $(seq 1 60); do
            if curl -sf localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          echo "health endpoint did not come up within 60s"
          docker compose logs
          exit 1

      - name: Assert health status
        run: curl -sf localhost:3000/api/health | jq -e '.status=="ok"'

      - name: Assert UI serves island marker
        run: curl -fs localhost:3000/ | grep -q astro-island

      - name: Tear down
        if: always()
        run: docker compose down -v
