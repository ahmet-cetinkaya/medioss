services:
  backend:
    build: .
    ports: ["3000:3000"]
    volumes:
      - app_data:/data
    environment:
      - RUST_LOG=info
      - MEDIOSS_DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  app_data:
    driver: local
