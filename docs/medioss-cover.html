<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediOSS Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1400px;
            height: 350px;
            /* Canvas gradient: Hybrid Soft Nature + Cool Serene */
            background: linear-gradient(135deg,
                #F5F1EA 0%,      /* top-left: cream */
                #D8D3D0 25%,     /* soft gray */
                #A8C5A8 65%,     /* soft nature green */
                #C5D9E8 100%     /* cool blue */
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 60px;
        }

        /* Soft glass card effect (Design System §2.2, §3: elevation-1) */
        .card {
            position: relative;
            background: rgb(255 255 255 / 0.45);
            border: 1px solid rgb(255 255 255 / 0.75);
            border-radius: 2rem;
            padding: 40px 50px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px -8px rgb(150 100 120 / 0.18);
            display: flex;
            align-items: center;
            gap: 50px;
            max-width: 1280px;
            width: 100%;
        }

        /* Orb logo - left side (Design System §3.2: no animation) */
        .orb-container {
            flex-shrink: 0;
        }

        .orb {
            width: 120px;
            height: 120px;
        }

        .orb-circle {
            width: 100%;
            height: 100%;
            /* Orb gradient: Design System §3.2 — white specular → lavender → amethyst → deep purple */
            background: radial-gradient(circle at 30% 30%,
                #ffffff 0%,
                #EEE6FF 25%,
                #B58AE6 60%,
                #67418F 100%
            );
            border-radius: 50%;
            /* Orb shadow: low-opacity, diffuse (Design System §2.1) */
            box-shadow:
                0 0 30px -5px rgb(103 65 143 / 0.25),
                inset -15px -15px 30px rgb(0 0 0 / 0.15);
            position: relative;
        }

        .orb-shimmer {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent 70%);
            border-radius: 50%;
            top: 16px;
            left: 20px;
            filter: blur(4px);
        }

        /* Content - right side */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Title (Design System §3: near-monochrome, text-strong) */
        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #2a2a2a;
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1.2;
        }

        /* Description (Design System §3: text-muted) */
        .description {
            font-size: 16px;
            line-height: 1.5;
            color: #575757;
            margin: 0;
            font-weight: 400;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="orb-container">
                <div class="orb">
                    <div class="orb-circle">
                        <div class="orb-shimmer"></div>
                    </div>
                </div>
            </div>
            <div class="content">
                <h1>MediOSS</h1>
                <p class="description">
                    Self-hosted wellness: meditation, soundscape mixer, mood tracker<br>
                    Your data, your server, your control
                </p>
            </div>
        </div>
    </div>
</body>
</html>
